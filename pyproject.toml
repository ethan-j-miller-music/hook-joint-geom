[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hook-joint-geom"
version = "0.1.0"
description = "Minimal geometric mappings for a 2-DOF Hooke (universal) joint"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Chang Liu"}]
dependencies = ["numpy>=2.4.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
